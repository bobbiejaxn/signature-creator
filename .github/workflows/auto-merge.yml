# Auto-merge CI Workflow
#
# Runs on every PR. When CI passes on a PR labeled "agent-generated",
# automatically squash-merges and deletes the branch.
#
# Human PRs (without the label) are unaffected — they need manual review.
#
# Install: Copy this file to <your-project>/.github/workflows/auto-merge.yml
#
# Required secrets (auto-available in GitHub):
#   GITHUB_TOKEN — used by actions/github-script

name: CI + Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  # ── CI Gate ──────────────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Lint
        run: npx eslint . --max-warnings 0
        continue-on-error: false

      - name: Test
        run: npm test
        continue-on-error: false

  # ── Acceptance tests (#70) ─────────────────────────────────────
  acceptance:
    needs: check
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking until stable for 3+ runs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install pi
        run: npm install -g @mariozechner/pi-coding-agent
        continue-on-error: true

      - name: Steer mid-run acceptance test
        run: bash scripts/acceptance/steer-mid-run.sh
        continue-on-error: true

  # ── Auto-merge ──────────────────────────────────────────────────
  automerge:
    needs: check
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'agent-generated')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.issue.number;
            const head_ref = context.payload.pull_request.head.ref;

            // Merge the PR
            try {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr_number,
                merge_method: 'squash',
              });
              console.log(`✅ Merged PR #${pr_number}`);
            } catch (error) {
              // Already merged or conflict — don't fail the workflow
              console.log(`Merge result: ${error.message}`);
              return;
            }

            // Delete the branch
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${head_ref}`,
              });
              console.log(`🗑️ Deleted branch ${head_ref}`);
            } catch (error) {
              console.log(`Branch delete: ${error.message}`);
            }

  # ── CI Failure Alert ────────────────────────────────────────────
  # When CI fails on an agent-generated PR, add a comment
  alert-failure:
    runs-on: ubuntu-latest
    if: failure() && contains(github.event.pull_request.labels.*.name, 'agent-generated')
    permissions:
      pull-requests: write
    steps:
      - name: Comment on failure
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ **CI failed on agent-generated PR.** Human review needed.\n\nCheck the [CI logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.',
            });
